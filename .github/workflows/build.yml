name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            arch: amd64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: |
          bun build --compile --minify --target=${{ matrix.target }} --outfile=./dist/vui-linux-${{ matrix.arch }} ./src/index.tsx
          chmod +x ./dist/vui-linux-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vui-linux-${{ matrix.arch }}
          path: ./dist/vui-linux-${{ matrix.arch }}
